<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyApp - Login Demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111}
.container{min-height:100vh;display:flex;flex-direction:column}
.main{display:flex;flex:1;min-height:calc(100vh - 86px)}
.left{width:66%;position:relative;display:flex;align-items:center;justify-content:center;border-right:1px solid #ddd;overflow:hidden}
.logo{position:absolute;top:38px;left:42px;font-size:25px;font-weight:700;color:#6c43d9}
.promo{text-align:center;width:min(760px,95%);padding:40px 24px}
.promo h1{font-size:43px;line-height:1.3;font-weight:400;margin-bottom:20px}
.gradient{background:linear-gradient(90deg,#ff684d,#e90086);background-clip:text;-webkit-background-clip:text;color:transparent}
.photo-collage{display:block;width:min(700px,100%);height:auto;margin:0 auto;object-fit:contain}
.right{width:34%;display:flex;align-items:center;justify-content:center;padding:40px}
.login-box{width:100%;max-width:490px}
.login-box h3{font-size:16px;font-weight:600;margin-bottom:22px}
.input{width:100%;height:54px;border:1px solid #ccc;border-radius:15px;padding:0 15px;margin-bottom:11px;font-size:13px}
.login-button{width:100%;height:40px;background:#9bc1f5;border:0;border-radius:25px;color:white;font-weight:bold;margin-top:10px;cursor:pointer}
.forgot{display:block;text-align:center;color:#333;font-size:14px;text-decoration:none;margin:23px 0 60px}
.secondary{width:100%;height:40px;border:1px solid #eee;border-radius:25px;background:#f5f5f5;margin-bottom:12px;cursor:pointer}
.create{width:100%;height:40px;border:1px solid #2678ff;border-radius:25px;background:white;color:#0866ff;cursor:pointer}
.brand{text-align:center;margin-top:24px;font-weight:bold;color:#445}
footer{border-top:1px solid #ddd;min-height:86px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:14px;padding:20px;color:#777;font-size:11px}
@media(max-width:800px){.main{min-height:calc(100vh - 86px)}.left{display:none}.right{width:100%;min-height:650px}}
</style>
</head>

  <main class="main">

      <div class="logo">MyApp</div>
